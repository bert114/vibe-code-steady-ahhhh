name: ui-design-check

on:
  pull_request:
    paths:
      - 'client/**'
      - 'DESIGN.md'
      - 'PRODUCT.md'
      - '.impeccable/**'
      - '.agents/skills/impeccable/scripts/**'
      - 'scripts/impeccable-design-check.cjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  detector:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Impeccable detector
        run: npm run design:check
