# Steady-Ahh dev compose — local parity only, not for beta/prod deploy.
# - server: Express API on :5000 (health: GET /api/health, CORS locked to CLIENT_ORIGIN)
# - client: Vite HMR on :5173 (browser calls API via VITE_API_URL=http://localhost:5000/api)
# Builds run from repo root so `npm ci --workspace=*` uses the single root
# lockfile (only root package-lock.json exists). Env names from .env.example;
# values come from existing server/.env + client/.env via env_file
# (never baked into images, never committed). Keeps Neon DATABASE_URL.
# Usage:
#   docker compose up --build
#   curl http://localhost:5000/api/health ; open http://localhost:5173
#   docker compose down

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile.dev
    env_file:
      - ./server/.env
    environment:
      # Non-secret dev defaults only; real secrets stay in server/.env.
      NODE_ENV: development
      PORT: "5000"
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app/server
      - /app/node_modules
      - /app/server/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5000/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile.dev
    env_file:
      - ./client/.env
    environment:
      # Polling helps Vite HMR on Windows bind mounts.
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app/client
      - /app/node_modules
      - /app/client/node_modules
    depends_on:
      server:
        condition: service_healthy
