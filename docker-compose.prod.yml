# Steady-Ahh production compose — local parity testing only.
# Runs production images (not dev). No bind mounts, no hot reload.
# Env injected via env_file (never baked into images).
# Usage:
#   docker compose -f docker-compose.prod.yml up --build
#   curl http://localhost:5173 ; curl http://localhost:5000/api/health
#   docker compose -f docker-compose.prod.yml down

services:
  server:
    image: najj2/steady-ahh-server:latest
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: "postgresql://user:pass@host:5432/db"
      GROQ_API_KEY: "gsk_your_key_here"
      CLERK_SECRET_KEY: "sk_test_your_key_here"
      CLERK_PUBLISHABLE_KEY: "pk_test_your_key_here"
      CLIENT_ORIGIN: "http://localhost:5173"
      AI_PROVIDER: "groq"
      GROQ_MODEL: "openai/gpt-oss-120b"
      AI_ANALYSIS_RATE_LIMIT: "5"
      OPEN_ACCESS: "false"
      DEV_AUTH_BYPASS: "false"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  client:
    image: najj2/steady-ahh-client:latest
    env_file:
      - ./client/.env
    ports:
      - "5173:5173"
    depends_on:
      server:
        condition: service_healthy

networks:
  default:
    name: steady-ahh-prod